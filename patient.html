<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف المريض الإلكتروني</title>
    <link rel="stylesheet" href="patient-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="patient-container">
       <header class="patient-header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة للوحة التحكم</a>
    <h2><i class="fa-solid fa-id-card"></i> الملف الشخصي للمريض</h2>
    
    <button id="deletePatientBtn" class="delete-btn"><i class="fa-solid fa-trash-can"></i> حذف المريض نهائياً</button>
</header>
        <section class="patient-info-card">
    <div class="info-grid">
        <div><strong>الاسم الكامل:</strong> <span id="view-name">جاري التحميل...</span></div>
        <div><strong>رقم المريض (ID):</strong> <span id="view-id">-</span></div>
        <div><strong>رقم Tليفون:</strong> <span id="view-phone">-</span></div>
        <div><strong>تاريخ الميلاد (السن):</strong> <span id="view-dob">-</span></div>
        
        <div><strong>إجمالي النقاط الحالية:</strong> <span id="view-total-points" class="badge-points">0 نقطة</span></div>
        
        <div class="full-width"><strong>التشخيص الحالي (مريض إيه؟):</strong> <span id="view-diagnosis" class="badge">-</span></div>
    </div>
</section>

        <div class="patient-content-layout">
            
            <section class="action-section">
                <h3><i class="fa-solid fa-plus-minus"></i> تسجيل إجراء / زيارة جديدة</h3>
                <form id="visitForm">
                    <div class="form-group">
                        <label>تاريخ الزيارة القادمة (الموعد القادم):</label>
                        <input type="date" id="nextVisitDate" required>
                    </div>
                    <div class="form-group">
                        <label>العلاج الموصوف / الذي تم صرفه في هذه الزيارة:</label>
                        <textarea id="visitMedication" rows="3" placeholder="اكتب الأدوية والجرعات هنا..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>النقاط المستحقة عن هذه الزيارة:</label>
                        <input type="number" id="visitPoints" min="0" placeholder="مثال: 10 نقاط" required>
                    </div>
                    <div class="form-group">
                        <label>ملاحظات صيدلانية أو إكلينيكية:</label>
                        <textarea id="visitNotes" rows="2" placeholder="أي ملحوظة حابب ترجع لها لاحقاً..."></textarea>
                    </div>
                    <button type="submit" class="save-visit-btn"><i class="fa-solid fa-floppy-disk"></i> حفظ الزيارة وتحديث النقاط</button>
                </form>
            </section>

            <section class="history-section">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> سجل المتابعة والزيارات السابقة</h3>
                <div class="visits-timeline" id="visitsTimeline">
                    <p class="empty-text">لا يوجد زيارات مسجلة مسبقاً لهذا المريض.</p>
                </div>
            </section>

        </div>
    </div>

    <script type="module" src="patient.js"></script>
</body>
</html>
