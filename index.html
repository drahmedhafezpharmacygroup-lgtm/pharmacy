<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إدارة المرضى</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --bg-color: #f4f6f9;
            --dark-color: #343a40;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-color);
            padding: 20px;
            direction: rtl;
        }
        .dashboard-container { max-width: 1300px; margin: 0 auto; }
        
        /* الهيدر العلوي */
        .main-header {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px; gap: 15px; flex-wrap: wrap;
        }
        .search-box-container { display: flex; gap: 10px; flex-grow: 1; max-width: 600px; }
        .search-box-container input { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; }
        .search-box-container button, .add-patient-btn {
            padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s;
        }
        #searchBtn { background: var(--primary-color); }
        #scanQRBtn { background: #6c757d; font-size: 18px; }
        .add-patient-btn { background: var(--success-color); font-size: 16px; }
        .add-patient-btn:hover { background: #218838; }

        /* تقسيم القوائم في الشاشة */
        .dashboard-content {
            display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 20px;
        }
        @media (max-width: 900px) { .dashboard-content { grid-template-columns: 1fr; } }
        
        .list-section { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); min-height: 350px; }
        .list-section h3 { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #f1f1f1; font-size: 18px; }
        .patients-list { display: flex; flex-direction: column; gap: 10px; }
        .empty-text { color: #888; font-style: italic; text-align: center; margin-top: 30px; }

        /* --- استبدل كود الـ Modal القديم في index.html بهذا الكود المطور --- */

/* النافذة الخلفية الشفافة */
.modal {
    display: none; 
    position: fixed; 
    z-index: 2000; 
    left: 0; 
    top: 0; 
    width: 100%; 
    height: 100%;
    background-color: rgba(0,0,0,0.6); 
    backdrop-filter: blur(3px);
    
    /* السطرين دول هما السر: بيسمحوا بالـ Scroll لو الفورمة طويلة */
    overflow-y: auto; 
    padding: 20px 0;
}

/* الصندوق الأبيض (الفورمة) */
.modal-content {
    background-color: #fff; 
    
    /* غيرنا الـ margin عشان يسيب مسافة متناسقة فوق وتحت */
    margin: 2% auto; 
    padding: 25px; 
    border-radius: 12px;
    width: 90%; 
    max-width: 500px; 
    position: relative; 
    box-shadow: 0 5px 25px rgba(0,0,0,0.2);
    animation: fadeIn 0.3s ease-in-out;
}
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .close-modal { position: absolute; left: 20px; top: 15px; font-size: 30px; cursor: pointer; color: #aaa; line-height: 1; }
        .close-modal:hover { color: #dc3545; }
        
        /* ستايل الفورمة */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .form-group input:focus { border-color: var(--primary-color); outline: none; }
        .submit-form-btn { width: 100%; padding: 12px; background: var(--success-color); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .submit-form-btn:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header class="main-header">
            <h2><i class="fa-solid fa-notes-medical" style="color: var(--primary-color);"></i> لوحة التحكم الصيدلية</h2>
            <div id="qr-reader" style="width:100%; max-width:400px; margin: 10px auto; display:none;"></div>
            <div class="search-box-container">
                <input type="text" id="searchInput" placeholder="ابحث باسم المريض، الـ ID، أو التليفون...">
                <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button id="scanQRBtn" title="مسح كود QR"><i class="fa-solid fa-qrcode"></i></button>
            </div>
            
            <button id="openAddModalBtn" class="add-patient-btn"><i class="fa-solid fa-plus"></i> مريض جديد</button>
        </header>

        <main class="dashboard-content">
            <section class="list-section">
                <h3><i class="fa-solid fa-calendar-day" style="color: var(--primary-color);"></i> مواعيد (اليوم / الغد)</h3>
                <div class="patients-list" id="todayActiveList">
                    <p class="empty-text">لا يوجد مواعيد مجدولة.</p>
                </div>
            </section>

            <section class="list-section">
                <h3><i class="fa-solid fa-triangle-exclamation" style="color: var(--warning-color);"></i> مواعيد فائتة (بدون نقاط)</h3>
                <div class="patients-list" id="missedActionList">
                    <p class="empty-text">لا يوجد مواعيد معلقة.</p>
                </div>
            </section>
        </main>
    </div>

    <div id="addPatientModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModalBtn">&times;</span>
            <h3><i class="fa-solid fa-user-plus" style="color: var(--success-color);"></i> إضافة مريض جديد للسيستم</h3>
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
            
            <form id="addPatientForm">
                <div class="form-group">
                    <label>الاسم الكامل للمريض:</label>
                    <input type="text" id="pName" required placeholder="اكتب الاسم ثلاثي أو ثنائي">
                </div>
                <div class="form-group">
                    <label>رقم التليفون:</label>
                    <input type="tel" id="pPhone" required placeholder="01xxxxxxxxx">
                </div>
                <div class="form-group">
                    <label>تاريخ الميلاد:</label>
                    <input type="date" id="pDob" required>
                </div>
                <div class="form-group">
                    <label>الحالة المرضية (مريض إيه؟):</label>
                    <input type="text" id="pDiagnosis" placeholder="مثال: ضغط مرتفع، سكري النوع الثاني" required>
                </div>
                <button type="submit" class="submit-form-btn">حفظ المريض وتوليد الكارت</button>
            </form>
        </div>
    </div>
<!-- حط السطر ده جوه الـ <head> في ملف index.html لو مش موجود -->
<script src="https://unpkg.com/html5-qrcode"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
